logo = "img/logo.svg"
colorScheme = "slate"
defaultAppearance = "light"
autoSwitchAppearance = false
customCSS = ["css/custom.css"]

[page404]
  enableQuotes = false

description = "As melhores promoções relâmpago, cupons verificados e achadinhos das maiores lojas online."
author = { name = "Equipe Achadinhos Flash" }

[header]
  layout = "basic"
  showTitle = true

[homepage]
  layout = "page"
  showRecent = true
  showRecentItems = 12
  cardView = true
  cardViewScreenWidth = false

# Controla a página /ofertas, /categories e /stores
[list]
  showCards = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
  showSummary = false

[article]
  showDate = true
  showViews = false
  showReadingTime = false
  showTableOfContents = true
  showAuthor = false
  showTaxonomies = true
  sharingLinks = ["whatsapp", "telegram", "twitter"]